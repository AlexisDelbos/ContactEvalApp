<!DOCTYPE html>
<html lang="en" layout:decorate="~{layout.html}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Liste des contacts</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4" layout:fragment="content">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow border-primary">
                <div class="card-header bg-primary text-white">
                    <h5 class="card-title mb-0">Mettre à jour un contact</h5>
                </div>
                <div class="card-body">
                    <form method="post" th:action="@{/save}">

                        <div class="form-group">
                            <label class="control-label"> Id : </label> <label th:text=${contact.id}></label>
                            <input class="form-control" name="id" th:value="${contact.id}" type="hidden">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Nom :</label>
                            <input class="form-control" name="lastName" th:value="${contact.lastName}" type="text">
                            <span class="text-danger" th:errors="${contact.lastName}"></span>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Prénom :</label>
                            <input class="form-control" name="firstName" th:value="${contact.firstName}" type="text">
                            <span class="text-danger" th:errors="${contact.firstName}"></span>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Mail :</label>
                            <input class="form-control" name="email" th:value="${contact.email}" type="text">
                            <span class="text-danger" th:errors="${contact.email}"></span>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Téléphone :</label>
                            <input class="form-control" name="phone" th:value="${contact.phone}" type="text">
                            <span class="text-danger" th:errors="${contact.phone}"></span>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Adresse :</label>
                            <input class="form-control" name="address" th:value="${contact.address}" type="text">
                            <span class="text-danger" th:errors="${contact.address}"></span>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Type de Contact :</label>
                            <select class="form-control" name="typeContact">
                                <option th:each="typeContact : ${typeContacts}"
                                        th:text="${typeContact.name}"
                                        th:value="${typeContact.id}">
                                </option>
                            </select>
                        </div>


                        <button class="btn btn-primary btn-block" type="submit">Editer</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
