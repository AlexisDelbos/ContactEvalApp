<!DOCTYPE html>
<html lang="fr" xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Landing Page - Contact Liste</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div>
    <nav class="navbar navbar-light bg-light ps-3">
        <div class="container-fluid">
            <div class="d-flex align-items-center">
                <a class="navbar-brand mb-0 me-3" href="#">Mon site demo-niaque</a>
                <ul class="nav nav-pills mb-0">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/login}">Se connecter</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</div>

<section class="container mt-4">
    <div class="card mt-4 shadow-sm">
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center py-3">
            <h5 class="mb-0">Liste des Contacts</h5>
        </div>
        <div class="card-body">
            <form class="mb-4">
                <div class="input-group">
                    <input class="form-control" name="keyword" placeholder="Rechercher par nom..." type="text">
                    <button class="btn btn-primary" type="submit">
                        <i class="bi bi-search"></i> Rechercher
                    </button>
                </div>
            </form>

            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                    <tr>
                        <th>Id</th>
                        <th>Nom</th>
                        <th>Prénom</th>
                        <th>Email</th>
                        <th>Adresse</th>
                        <th>Téléphone</th>
                        <th>Type</th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr>
                        <td>1</td>
                        <td>Dupont</td>
                        <td>Jean</td>
                        <td>jean.dupont@mail.com</td>
                        <td>123 Rue de Paris, 75000 Paris</td>
                        <td>01 23 45 67 89</td>
                        <td><span class="badge bg-info">Client</span></td>
                        <td>
                            <div class="btn-group">
                                <button class="btn btn-sm btn-info me-2" disabled>
                                    <i class="bi bi-pencil"></i> Modifier
                                </button>
                                <button class="btn btn-sm btn-danger" disabled>
                                    <i class="bi bi-trash"></i> Supprimer
                                </button>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td>2</td>
                        <td>Martin</td>
                        <td>Sophie</td>
                        <td>sophie.martin@mail.com</td>
                        <td>456 Avenue des Champs, 75000 Paris</td>
                        <td>01 98 76 54 32</td>
                        <td><span class="badge bg-warning">Fournisseur</span></td>
                        <td>
                            <div class="btn-group">
                                <button class="btn btn-sm btn-info me-2" disabled>
                                    <i class="bi bi-pencil"></i> Modifier
                                </button>
                                <button class="btn btn-sm btn-danger" disabled>
                                    <i class="bi bi-trash"></i> Supprimer
                                </button>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
